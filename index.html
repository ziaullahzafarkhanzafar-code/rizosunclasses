<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مینجمنٹ سسٹم ڈیش بورڈ</title>
    <style>
        body {
            font-family: 'Tahoma', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f7f6;
            color: #333;
        }
        header {
            background-color: #007bff;
            color: white;
            padding: 15px 20px;
            text-align: center;
        }
        .container {
            display: flex;
            min-height: 90vh;
        }
        sidebar {
            width: 250px;
            background-color: #343a40;
            color: white;
            padding: 20px;
        }
        sidebar ul {
            list-style: none;
            padding: 0;
        }
        sidebar ul li {
            padding: 10px 0;
            border-bottom: 1px solid #495057;
        }
        sidebar ul li a {
            color: white;
            text-decoration: none;
        }
        sidebar ul li a:hover {
            color: #17a2b8;
        }
        .main-content {
            flex-grow: 1;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <header>
        <h1>مینجمنٹ سسٹم پورٹل</h1>
    </header>

    <div class="container">
        <sidebar>
            <h3>مینو</h3>
            <ul>
                <li><a href="#">ڈیش بورڈ</a></li>
                <li><a href="#">صارفین کی فہرست</a></li>
                <li><a href="#">رپورٹس</a></li>
                <li><a href="#">سیٹنگز</a></li>
            </ul>
        </sidebar>

        <div class="main-content">
            <div class="card">
                <h2>خوش آمدید!</h2>
                <p>یہ آپ کے مینجمنٹ سسٹم کا بنیادی ایچ ٹی ایم ایل اور سی ایس ایس (HTML/CSS) لے آؤٹ ہے۔ آپ اس میں اپنے پروجیکٹ کے لحاظ سے مزید فیچرز شامل کر سکتے ہیں۔</p>
            </div>
        </div>
    </div>

</body>
</html>
